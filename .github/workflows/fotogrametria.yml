name: Prueba de fotogrametría
# Prueba de factibilidad: procesa una carpeta de fotos en GitHub Actions de dos
# formas y compara tiempo y resultado.
#   - Linux: COLMAP (alineación) + OpenMVS (nube densa, malla y textura), solo CPU.
#   - Mac: Object Capture de Apple, si la Mac virtual de GitHub lo admite.
# Los modelos quedan como artefactos (se borran en 3 días) y las vistas previas
# y los tiempos en la rama fotogrametria-resultados.
on:
  workflow_dispatch:
    inputs:
      enlace:
        description: Enlace público a la carpeta de Google Drive con las fotos
        required: true
      lado:
        description: Lado máximo de las fotos en píxeles (más chico = más rápido)
        default: "3000"
      detalle:
        description: Detalle de Object Capture (reduced, medium, full)
        default: medium
      metodos:
        description: Qué correr
        type: choice
        options: [todos, colmap, openmvs, objectcapture, vistas]
        default: todos
      nivel:
        description: Para OpenMVS - resolución de la nube densa (1 = mitad, 2 = cuarto, más rápido)
        default: "2"
      corrida:
        description: Solo para "openmvs" y "vistas" - número de corrida (run id) de donde tomar la alineación o el modelo
        default: ""
permissions:
  contents: write
  actions: read
concurrency:
  group: fotogrametria-${{ inputs.metodos }}
  cancel-in-progress: false
jobs:
  descargar:
    if: inputs.metodos != 'vistas' && inputs.metodos != 'openmvs'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      fotos: ${{ steps.preparar.outputs.fotos }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotos de Google Drive
        timeout-minutes: 40
        env:
          ENLACE: ${{ inputs.enlace }}
        run: |
          pip install --quiet gdown
          python3 -u herramientas/descargar_drive.py "$ENLACE" crudas
          ls -la crudas | head -20
          du -sh crudas
      - name: Convertir a JPG, enderezar y reducir
        id: preparar
        env:
          LADO: ${{ inputs.lado }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick libheif-examples > /dev/null
          mkdir -p fotos
          n=0
          shopt -s nocaseglob nullglob
          for f in crudas/*; do
            base=$(basename "${f%.*}")
            case "${f,,}" in
              *.heic|*.heif) heif-convert -q 92 "$f" "/tmp/$base.jpg" > /dev/null && origen="/tmp/$base.jpg" ;;
              *.jpg|*.jpeg|*.png) origen="$f" ;;
              *) echo "Omito $f"; continue ;;
            esac
            convert "$origen" -auto-orient -resize "${LADO}x${LADO}>" -quality 92 "fotos/$(printf '%04d' $n)-$base.jpg"
            n=$((n + 1))
          done
          echo "fotos=$n" >> "$GITHUB_OUTPUT"
          echo "Fotos listas: $n"
          identify -format '%wx%h\n' fotos/* | sort | uniq -c
      - uses: actions/upload-artifact@v4
        with:
          name: fotos
          path: fotos
          retention-days: 1

  colmap-sfm:
    needs: descargar
    if: inputs.metodos == 'todos' || inputs.metodos == 'colmap'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fotos
          path: fotos
      - name: Instalar COLMAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq colmap > /dev/null
          nproc; free -h; df -h .
      - name: Alinear fotos (COLMAP)
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          T0=$(date +%s)
          marca() { echo "$1: $(( ($(date +%s) - T0) / 60 )) min" | tee -a tiempos-sfm.txt; }
          N=$(ls fotos | wc -l)
          echo "Fotos: $N" | tee tiempos-sfm.txt
          # 2000 px and 6000 points per photo are plenty to align them, and much faster.
          colmap feature_extractor --database_path db.db --image_path fotos \
            --ImageReader.camera_model OPENCV \
            --SiftExtraction.use_gpu 0 --SiftExtraction.max_image_size 2000 --SiftExtraction.max_num_features 6000
          marca "Puntos clave"
          if [ "$N" -le 200 ]; then
            colmap exhaustive_matcher --database_path db.db --SiftMatching.use_gpu 0
          else
            colmap sequential_matcher --database_path db.db --SiftMatching.use_gpu 0 --SequentialMatching.overlap 20
          fi
          marca "Emparejado"
          mkdir -p sparse
          colmap mapper --database_path db.db --image_path fotos --output_path sparse \
            --Mapper.ba_global_images_ratio 1.3 --Mapper.ba_global_points_ratio 1.3 --Mapper.ba_global_max_num_iterations 30
          marca "Alineación (SfM)"
          # The model with most registered photos.
          MEJOR=$(for m in sparse/*/; do echo "$(colmap model_analyzer --path "$m" 2>&1 | grep -i 'Registered images' | grep -o '[0-9]*$') $m"; done | sort -nr | head -1)
          echo "Modelo elegido (fotos alineadas, carpeta): $MEJOR" | tee -a tiempos-sfm.txt
          MODELO=$(echo "$MEJOR" | awk '{print $2}')
          colmap image_undistorter --image_path fotos --input_path "$MODELO" --output_path densa --output_type COLMAP --max_image_size 2000
          # The OpenMVS build reads the cameras as text.
          colmap model_converter --input_path densa/sparse --output_path densa/sparse --output_type TXT
          marca "Corrección de lente"
          mkdir -p resultados/colmap
          cp tiempos-sfm.txt resultados/colmap/
      - uses: actions/upload-artifact@v4
        with:
          name: sfm
          path: densa
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiempos-sfm
          path: tiempos-sfm.txt
          retention-days: 3

  colmap-openmvs:
    needs: colmap-sfm
    if: always() && (needs.colmap-sfm.result == 'success' || inputs.metodos == 'openmvs')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sfm
          path: densa
          run-id: ${{ inputs.corrida != '' && inputs.corrida || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tiempos-sfm
          run-id: ${{ inputs.corrida != '' && inputs.corrida || github.run_id }}
          github-token: ${{ github.token }}
      - name: Memoria de intercambio
        run: |
          # 16 GB of RAM aren't enough to fuse 440 depth maps; add 24 GB of swap on the big disk.
          df -h /mnt .
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/intercambio && sudo chmod 600 /mnt/intercambio
          sudo mkswap /mnt/intercambio > /dev/null && sudo swapon /mnt/intercambio
          free -h
      - name: Instalar OpenMVS
        run: |
          docker pull -q openmvs/openmvs-ubuntu:latest
          ls densa densa/sparse | head; ls densa/images | wc -l
      - name: Nube densa, malla y textura (OpenMVS)
        run: |
          set -euo pipefail
          T0=$(date +%s)
          marca() { echo "$1: $(( ($(date +%s) - T0) / 60 )) min" | tee -a tiempos-mvs.txt; }
          mvs() {
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/w" -w /w openmvs/openmvs-ubuntu:latest \
              sh -c "export PATH=\$PATH:/usr/local/bin/OpenMVS:/openMVS_build/bin; $*"
          }
          echo "OpenMVS" > tiempos-mvs.txt
          mvs InterfaceCOLMAP -i densa -o escena.mvs --image-folder images
          marca "Importar"
          # Quarter resolution (500 px) for the depth maps, about 4 times faster and
          # lighter than half; the texture still uses the full 2000 px photos.
          mvs DensifyPointCloud escena.mvs --resolution-level ${{ inputs.nivel || '2' }} --max-threads 0
          marca "Nube densa"
          mvs ReconstructMesh escena_dense.mvs
          marca "Malla"
          mvs TextureMesh escena_dense_mesh.mvs --export-type obj
          marca "Textura"
          ls -la
          mkdir -p modelo
          mv escena_dense_mesh_texture*.obj escena_dense_mesh_texture*.mtl escena_dense_mesh_texture*.png escena_dense_mesh_texture*.jpg modelo/ 2>/dev/null || true
          ls -la modelo
          du -sh modelo
      - name: Guardar tiempos
        if: always()
        run: |
          mkdir -p resultados/colmap
          cat tiempos-sfm.txt tiempos-mvs.txt > resultados/colmap/tiempos.txt 2>/dev/null || cp tiempos-mvs.txt resultados/colmap/tiempos.txt || echo "Sin tiempos" > resultados/colmap/tiempos.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelo-colmap
          path: |
            modelo
            resultados
          retention-days: 3

  object-capture:
    needs: descargar
    if: inputs.metodos == 'todos' || inputs.metodos == 'objectcapture'
    # Apple silicon (arm64): Object Capture needs its GPU.
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fotos
          path: fotos
      - name: Compilar herramientas
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string; sysctl -n hw.memsize
          system_profiler SPDisplaysDataType | head -20 || true
          swiftc -O -parse-as-library herramientas/ObjectCapture.swift -o objectcapture
          swiftc -O herramientas/Vistas.swift -o vistas
      - name: Object Capture
        id: oc
        env:
          DETALLE: ${{ inputs.detalle }}
        run: |
          mkdir -p resultados/objectcapture
          T0=$(date +%s)
          set +e
          ./objectcapture fotos modelo.usdz "$DETALLE" 2>&1 | tee resultados/objectcapture/registro.txt
          CODIGO=${PIPESTATUS[0]}
          echo "Código: $CODIGO · $(( ($(date +%s) - T0) / 60 )) min" | tee resultados/objectcapture/tiempos.txt
          ls -la modelo.usdz 2>/dev/null || true
          exit 0
      - name: Vistas de Object Capture
        if: hashFiles('modelo.usdz') != ''
        run: ./vistas modelo.usdz resultados/objectcapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelo-objectcapture
          path: |
            modelo.usdz
            resultados
          retention-days: 3

  vistas-colmap:
    needs: colmap-openmvs
    if: always() && (needs.colmap-openmvs.result == 'success' || inputs.metodos == 'vistas')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: modelo-colmap
          path: colmap
          run-id: ${{ inputs.metodos == 'vistas' && inputs.corrida != '' && inputs.corrida || github.run_id }}
          github-token: ${{ github.token }}
      - name: Reducir la malla
        run: |
          ls -la colmap colmap/modelo
          python3 -m pip install --quiet --break-system-packages pymeshlab || python3 -m pip install --quiet pymeshlab
          OBJ=$(ls colmap/modelo/*.obj | head -1)
          mkdir -p reducido
          cp colmap/modelo/*.jpg colmap/modelo/*.png reducido/ 2>/dev/null || true
          python3 herramientas/reducir.py "$OBJ" reducido/modelo.obj 1500000
          ls -la reducido
      - name: Convertir a USDZ y hacer vistas
        run: |
          swiftc -O herramientas/Vistas.swift -o vistas
          mkdir -p resultados/colmap
          ./vistas reducido/modelo.obj resultados/colmap modelo-colmap.usdz
          ls -la modelo-colmap.usdz
      - uses: actions/upload-artifact@v4
        with:
          name: modelo-colmap-usdz
          path: |
            modelo-colmap.usdz
            reducido
            resultados
          retention-days: 3

  publicar:
    needs: [descargar, colmap-sfm, colmap-openmvs, object-capture, vistas-colmap]
    if: always() && (needs.object-capture.result == 'success' || needs.vistas-colmap.result == 'success' || needs.colmap-openmvs.result != 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: modelo-*
          path: artefactos
      - name: Subir vistas y tiempos a la rama de resultados
        env:
          FOTOS: ${{ needs.descargar.outputs.fotos }}
          RESULTADOS: "descargar=${{ needs.descargar.result }} sfm=${{ needs.colmap-sfm.result }} openmvs=${{ needs.colmap-openmvs.result }} objectcapture=${{ needs.object-capture.result }} vistas=${{ needs.vistas-colmap.result }}"
        run: |
          DESTINO=$(mktemp -d)
          RUN="${GITHUB_RUN_ID}"
          mkdir -p "$DESTINO/$RUN"
          for d in artefactos/*/resultados; do cp -R "$d/." "$DESTINO/$RUN/"; done
          {
            echo "# Corrida $RUN"
            echo
            echo "- Fotos: $FOTOS"
            echo "- Trabajos: $RESULTADOS"
            for f in "$DESTINO/$RUN"/*/tiempos.txt; do echo; echo "## $(basename "$(dirname "$f")")"; echo '```'; cat "$f"; echo '```'; done
          } > "$DESTINO/$RUN/README.md"
          cat "$DESTINO/$RUN/README.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin fotogrametria-resultados 2>/dev/null; then
            git checkout -B fotogrametria-resultados origin/fotogrametria-resultados
          else
            git checkout --orphan fotogrametria-resultados
            git rm -rf --quiet .
          fi
          rm -rf artefactos
          cp -R "$DESTINO/$RUN" .
          git add "$RUN"
          git commit -m "Resultados de fotogrametría $RUN"
          git push origin fotogrametria-resultados
